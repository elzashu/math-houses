<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Домики — цикл</title>

<!-- PWA-настройки -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e17055">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Домики">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow-y: auto;
  }
  body {
    font-family: 'Comic Sans MS', system-ui, sans-serif;
    background: linear-gradient(160deg, #ffeaa7, #fab1a0);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 8px;
  }
  .card {
    background: white;
    border-radius: 22px;
    padding: 16px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.22);
    text-align: center;
  }
  h1 { font-size: 17px; color: #e17055; margin-bottom: 8px; }

  .progress-bar {
    width: 100%;
    height: 10px;
    background: #dfe6e9;
    border-radius: 5px;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #55efc4, #00b894);
    width: 0%;
    transition: width 0.4s;
  }

  .stars {
    margin-bottom: 6px;
    min-height: 34px;
    display: flex;
    justify-content: center;
  }
  .stars-count {
    color: #e17055;
    font-weight: bold;
    font-size: 22px;
    background: #fff5e6;
    padding: 6px 18px;
    border-radius: 12px;
    display: inline-block;
  }

  /* Домик */
  .house {
    display: inline-block;
    margin: 10px auto 6px;
    padding: 0;
    border-radius: 16px;
    background: #fff5e6;
    box-shadow: 0 6px 20px rgba(225, 112, 85, 0.2);
    overflow: hidden;
  }
  .roof {
    background: linear-gradient(135deg, #e17055, #fab1a0);
    color: white;
    font-size: 60px;
    font-weight: bold;
    padding: 18px 60px;
    letter-spacing: 2px;
    line-height: 1;
  }
  .floor {
    display: flex;
    gap: 0;
  }
  .cell {
    width: 130px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: bold;
    color: #2d3436;
    background: #fff;
    border-top: 4px solid #e17055;
  }
  .cell.given {
    background: #fff5e6;
    color: #e17055;
  }
  .cell.empty {
    color: #0984e3;
  }
  .cell.empty.correct {
    animation: pulse 0.5s;
    background: #d4f5e9;
    color: #00b894;
  }
  .cell.empty.wrong {
    animation: shake 0.4s;
    background: #ffe0e0;
    color: #d63031;
  }
  .cell:first-child { border-right: 4px solid #e17055; }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .feedback {
    font-size: 20px;
    min-height: 26px;
    margin: 8px 0;
    font-weight: bold;
  }
  .feedback.ok { color: #00b894; }
  .feedback.no { color: #e17055; }

  .dots {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 6px 0;
    min-height: 32px;
    align-items: center;
  }
  .dot-group {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    max-width: 110px;
    justify-content: center;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #74b9ff;
  }
  .dot.plus { background: #ffeaa7; }
  .dot.mystery {
    background: #dfe6e9;
    border: 2px dashed #b2bec3;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 10px;
  }
  .keypad button {
    font-size: 26px;
    font-weight: bold;
    padding: 10px 0;
    border: none;
    border-radius: 12px;
    background: #dfe6e9;
    color: #2d3436;
    cursor: pointer;
    transition: transform 0.08s, background 0.15s;
    font-family: inherit;
    touch-action: manipulation;
  }
  .keypad button:active { transform: scale(0.94); background: #b2bec3; }
  .keypad button.del { background: #fab1a0; }
  .keypad button.ok  { background: #55efc4; }

  .actions {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .actions button {
    font-size: 14px;
    padding: 8px 14px;
    border: none;
    border-radius: 10px;
    background: #e17055;
    color: white;
    cursor: pointer;
    font-family: inherit;
  }
  .actions button:active { transform: scale(0.96); }

  /* Экран финиша */
  .finish {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px 0;
  }
  .finish.show { display: flex; }
  .finish-title {
    font-size: 32px;
    color: #e17055;
    font-weight: bold;
  }
  .finish-stars-count {
    font-size: 56px;
    color: #e17055;
    font-weight: bold;
    background: #fff5e6;
    padding: 16px 32px;
    border-radius: 20px;
    display: inline-block;
  }
  .finish-score {
    font-size: 22px;
    color: #e17055;
    font-weight: bold;
  }
  .finish-button {
    font-size: 20px;
    padding: 14px 28px;
    border: none;
    border-radius: 14px;
    background: #e17055;
    color: white;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
  }
  .finish-button:active { transform: scale(0.96); }

  @media (max-height: 700px) {
    .roof { font-size: 48px; padding: 12px 40px; }
    .cell { width: 100px; height: 84px; font-size: 44px; }
    .keypad button { font-size: 22px; padding: 8px 0; }
    h1 { font-size: 15px; }
    .stars-count { font-size: 18px; padding: 4px 14px; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>🏠 Домики — цикл</h1>

  <!-- Экран игры -->
  <div id="gameScreen">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="stars" id="stars"></div>

    <div class="house">
      <div class="roof" id="roof">7</div>
      <div class="floor">
        <div class="cell given" id="cellLeft">2</div>
        <div class="cell empty" id="cellRight">?</div>
      </div>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="dots" id="dots"></div>

    <div class="keypad">
      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button class="del" onclick="del()">⌫</button>
      <button onclick="press('0')">0</button>
      <button class="ok" onclick="check()">✓</button>
    </div>

    <div class="actions">
      <button onclick="hint()">💡 Подсказка</button>
      <button onclick="newTask()">🔄 Пропустить</button>
    </div>
  </div>

  <!-- Экран финиша -->
  <div class="finish" id="finishScreen">
    <div class="finish-title">🎉 Цикл пройден!</div>
    <div id="finishStars"></div>
    <div class="finish-score" id="finishScore"></div>
    <button class="finish-button" onclick="restartCycle()">🔄 Ещё раз</button>
  </div>
</div>

<script>
let roof, given, correct, input = "";
let filledIsLeft = true;   // позиция известного числа
let stars = 0;
let attemptCount = 0;
const RETRY_AFTER = 4;

let allTasks = [];
let remaining = [];
let retryQueue = [];
let TOTAL = 0;

// ============ ГЕНЕРАЦИЯ ВСЕХ ДОМИКОВ ============

function buildAllTasks() {
  const tasks = [];
  // Число на крыше от 2 до 10
  for (let r = 2; r <= 10; r++) {
    // Известное слагаемое от 1 до (r-1)
    for (let g = 1; g <= r - 1; g++) {
      // Два варианта позиции: слева или справа
      tasks.push({ roof: r, given: g, correct: r - g, filledIsLeft: true });
      tasks.push({ roof: r, given: g, correct: r - g, filledIsLeft: false });
    }
  }
  return tasks;
}

function shuffle(arr) {
  const arr2 = [...arr];
  for (let i = arr2.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr2[i], arr2[j]] = [arr2[j], arr2[i]];
  }
  return arr2;
}

// ============ ЗАПУСК ЦИКЛА ============

function restartCycle() {
  allTasks = buildAllTasks();      // 90 домиков
  TOTAL = allTasks.length;
  remaining = shuffle(allTasks);
  retryQueue = [];
  stars = 0;
  input = "";
  attemptCount = 0;

  document.getElementById("gameScreen").style.display = "block";
  document.getElementById("finishScreen").classList.remove("show");

  updateStars();
  updateProgress();
  newTask();
}

// ============ ПОКАЗ ДОМИКА ============

function showTask(task) {
  roof = task.roof;
  given = task.given;
  correct = task.correct;
  filledIsLeft = task.filledIsLeft;

  document.getElementById("roof").textContent = roof;

  const leftCell = document.getElementById("cellLeft");
  const rightCell = document.getElementById("cellRight");

  if (filledIsLeft) {
    leftCell.className = "cell given";
    leftCell.textContent = given;
    rightCell.className = "cell empty";
    rightCell.textContent = "?";
  } else {
    leftCell.className = "cell empty";
    leftCell.textContent = "?";
    rightCell.className = "cell given";
    rightCell.textContent = given;
  }

  input = "";
  attemptCount = 0;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("dots").innerHTML = "";
}

// ============ ВЫБОР СЛЕДУЮЩЕГО ============

function newTask() {
  if (remaining.length === 0 && retryQueue.length === 0) {
    finishCycle();
    return;
  }

  for (let i = 0; i < retryQueue.length; i++) {
    retryQueue[i].wait--;
  }

  const readyIndex = retryQueue.findIndex(t => t.wait <= 0);
  if (readyIndex !== -1) {
    const task = retryQueue.splice(readyIndex, 1)[0];
    showTask(task);
  } else if (remaining.length > 0) {
    const task = remaining.shift();
    showTask(task);
  }
}

// ============ ВВОД ============

function updateEmptyCell() {
  const leftCell = document.getElementById("cellLeft");
  const rightCell = document.getElementById("cellRight");
  const emptyCell = leftCell.classList.contains("empty") ? leftCell : rightCell;
  emptyCell.textContent = input || "?";
}

function press(n) {
  if (input.length >= 2) return;
  input += n;
  updateEmptyCell();
}

function del() {
  input = input.slice(0, -1);
  updateEmptyCell();
}

// ============ ПРОВЕРКА ============

function check() {
  if (input === "") return;
  const val = parseInt(input, 10);
  const fb = document.getElementById("feedback");
  const leftCell = document.getElementById("cellLeft");
  const rightCell = document.getElementById("cellRight");
  const emptyCell = leftCell.classList.contains("empty") ? leftCell : rightCell;

  if (val === correct) {
    if (attemptCount === 0) {
      stars++;   // ⭐ только за правильный ответ с первой попытки
    }
    emptyCell.classList.add("correct");
    fb.textContent = ["Молодец! 🎉", "Верно! ⭐", "Супер! 🌟", "Отлично! 👏"][Math.floor(Math.random()*4)];
    fb.className = "feedback ok";
    updateStars();
    updateProgress();

    setTimeout(() => {
      emptyCell.classList.remove("correct");
      newTask();
    }, 900);
  } else {
    attemptCount++;
    emptyCell.classList.add("wrong");
    fb.textContent = "Не подходит, попробуй ещё 🙂";
    fb.className = "feedback no";

    // Добавить в очередь повторов с той же позицией
    const alreadyQueued = retryQueue.some(t => t.roof === roof && t.given === given && t.filledIsLeft === filledIsLeft);
    if (!alreadyQueued) {
      retryQueue.push({
        roof: roof,
        given: given,
        correct: correct,
        filledIsLeft: filledIsLeft,
        wait: RETRY_AFTER
      });
    } else {
      const t = retryQueue.find(t => t.roof === roof && t.given === given && t.filledIsLeft === filledIsLeft);
      if (t) t.wait = RETRY_AFTER;
    }

    input = "";
    setTimeout(() => {
      emptyCell.classList.remove("wrong");
      updateEmptyCell();
    }, 800);
  }
}

// ============ ПОДСКАЗКА ============

function hint() {
  const dots = document.getElementById("dots");
  dots.innerHTML = "";

  const g1 = document.createElement("div"); g1.className = "dot-group";
  for (let i = 0; i < given; i++) {
    const d = document.createElement("div"); d.className = "dot"; g1.appendChild(d);
  }
  dots.appendChild(g1);

  const plus = document.createElement("div");
  plus.style.fontSize = "26px";
  plus.style.color = "#636e72";
  plus.textContent = "+";
  dots.appendChild(plus);

  const g2 = document.createElement("div"); g2.className = "dot-group";
  for (let i = 0; i < correct; i++) {
    const d = document.createElement("div");
    d.className = "dot mystery";
    g2.appendChild(d);
  }
  dots.appendChild(g2);
}

// ============ ОТОБРАЖЕНИЕ ============

function updateStars() {
  document.getElementById("stars").innerHTML =
    '<span class="stars-count">⭐ ' + stars + ' из ' + TOTAL + '</span>';
}

function updateProgress() {
  const solved = TOTAL - remaining.length - retryQueue.length;
  const percent = (solved / TOTAL) * 100;
  document.getElementById("progressFill").style.width = percent + "%";
}

// ============ ФИНИШ ============

function finishCycle() {
  document.getElementById("gameScreen").style.display = "none";
  const fs = document.getElementById("finishScreen");
  fs.classList.add("show");

  document.getElementById("finishStars").innerHTML =
    '<span class="finish-stars-count">⭐ ' + stars + ' из ' + TOTAL + '</span>';

  let message = "";
  const percent = (stars / TOTAL) * 100;
  if (stars === TOTAL) message = "🏆 Идеально! Все " + TOTAL + " домиков с первой попытки!";
  else if (percent >= 90) message = "🌟 Отлично! Очень близко к идеалу!";
  else if (percent >= 70) message = "👍 Хорошо! Продолжай тренироваться!";
  else message = "💪 Неплохо! Попробуй ещё раз — будет лучше!";

  document.getElementById("finishScore").innerHTML =
    message + "<br><br>Собрано звёзд: <b>" + stars + " из " + TOTAL + "</b>";
}

// ============ СТАРТ ============

restartCycle();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>
